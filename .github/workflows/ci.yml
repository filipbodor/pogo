name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        go: ["1.26.x", "1.27.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Fetch pinned Zsh source for Linux integration tests
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zsh-users/zsh
          ref: 73d317384c9225e46d66444f93b46f0fbe7084ef # zsh-5.9
          path: .ci/zsh
          persist-credentials: false
      - name: Build Zsh for Linux integration tests
        if: runner.os == 'Linux'
        timeout-minutes: 5
        working-directory: .ci/zsh
        run: |
          ./Util/preconfig
          ./configure --prefix="$RUNNER_TEMP/pogo-zsh" --disable-dynamic --with-tcsetpgrp
          make -j2
          make install.bin install.fns
          echo "$RUNNER_TEMP/pogo-zsh/bin" >> "$GITHUB_PATH"
      - run: zsh --version
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o build/pogo ./cmd/pogo
      - run: ./build/pogo --version
